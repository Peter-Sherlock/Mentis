<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Mentis — From intent to evidence</title>
<desc id="desc">Mentis 品牌封面。深蓝背景上的目标、委托、观察和修订闭环，表达以实际作品和证据推动协作。此图为概念示意，不是运行截图。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#10152B"/><stop offset=".55" stop-color="#14233A"/><stop offset="1" stop-color="#122D35"/></linearGradient>
 <linearGradient id="accent" x1="952" y1="140" x2="1448" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#B5C5FF"/><stop offset=".55" stop-color="#9AF2DE"/><stop offset="1" stop-color="#50B8C4"/></linearGradient>
 <linearGradient id="rule" x1="90" y1="450" x2="860" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#8AE7D6" stop-opacity=".8"/><stop offset="1" stop-color="#8AE7D6" stop-opacity="0"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#83E4CE" stop-opacity=".11"/><stop offset="1" stop-color="#83E4CE" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#C4D3E3" opacity=".13"/></pattern>
</defs>
