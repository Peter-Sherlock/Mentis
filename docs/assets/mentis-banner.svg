<text x="135" y="93" fill="#9DDCCD" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="4">INTENT · CRAFT · EVIDENCE</text>
<text x="88" y="253" fill="#F0F5FA" font-family="Segoe UI,Arial,sans-serif" font-size="140" font-weight="700" letter-spacing="-6">Mentis<tspan fill="#99E8D8">.</tspan></text>
<text x="94" y="329" fill="#DBE8ED" font-family="Segoe UI,Microsoft YaHei,PingFang SC,sans-serif" font-size="35" font-weight="400">从你的想法，到有依据的作品。</text>
<text x="96" y="386" fill="#9AAFC2" font-family="Segoe UI,Arial,sans-serif" font-size="24">From intent to evidence. From feedback to better work.</text>
